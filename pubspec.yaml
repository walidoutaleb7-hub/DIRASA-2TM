name: video_meet_app
description: DIRASA 2TM Professional App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  zego_uikit_prebuilt_video_conference: ^2.10.3
  shared_preferences: ^2.2.2
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.7.7
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  http: ^1.2.0
  google_generative_ai: ^0.4.7
  image_picker: ^1.0.7
  google_fonts: ^6.1.0
  permission_handler: ^13.0.2
  youtube_player_iframe: ^4.0.4
  google_sign_in: ^6.2.1
  markdown_widget: ^2.3.2+1
  flutter_math_fork: ^0.7.2
  record: ^5.1.0
  just_audio: ^0.9.36
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  intl: ^0.19.0
  web: ^1.0.0
  firebase_core_platform_interface: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
