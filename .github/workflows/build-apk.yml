name: Build Universal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-universal-v2

      - name: Create Android Scaffolding
        run: flutter create . --platforms=android

      - name: Increase Gradle Memory
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties

      - name: Fix Android Manifest
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET, os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
              tree = ET.parse(path)
              root = tree.getroot()
              perms = ["CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS", "INTERNET", "ACCESS_NETWORK_STATE", "BLUETOOTH"]
              existing = [p.get("{http://schemas.android.com/apk/res/android}name") for p in root.findall("uses-permission")]
              for p in perms:
                  full_p = "android.permission." + p
                  if full_p not in existing:
                      ET.SubElement(root, "uses-permission", {"{http://schemas.android.com/apk/res/android}name": full_p})
              app = root.find("application")
              if app is not None:
                  app.set("{http://schemas.android.com/apk/res/android}label", "DIRASA 2TM")
                  # تم حذف سطر extractNativeLibs من هنا
                  act = app.find("activity")
                  if act is not None:
                      act.set("{http://schemas.android.com/apk/res/android}exported", "true")
              tree.write(path, encoding="utf-8", xml_declaration=True)
          '

      - name: Fix Gradle Config (Universal Compatibility)
        run: |
          # compileSdk 37 مطلوب للمكتبات الحديثة، targetSdk 34 ليعمل على جميع الهواتف
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle.kts
          
          # إيقاف أي ضغط للكود
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/g' android/app/build.gradle.kts
          
          # إضافة packagingOptions في المكان الصحيح
          sed -i 's/android {/android {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' android/app/build.gradle.kts
          
          if ! grep -q "multiDexEnabled" android/app/build.gradle.kts; then
            sed -i 's/defaultConfig {/defaultConfig {\n            multiDexEnabled = true/' android/app/build.gradle.kts
          fi

      - name: Setup Firebase Config
        run: |
          cp google-services.json android/app/google-services.json
          sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/' android/settings.gradle.kts
          sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build Universal APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "universal-v1.0.${{ github.run_number }}"
          name: "DIRASA 2TM - Universal Build ${{ github.run_number }}"
          body: "النسخة الشاملة التي تعمل على جميع الهواتف"
          draft: false
          prerelease: false
          allowUpdates: true
          replacesArtifacts: true
