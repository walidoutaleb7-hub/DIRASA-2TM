name: Build Flutter APK (Final Stable)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🚀 توفير مساحة ضخمة على السيرفر (مسح ملفات غير ضرورية)
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25.1.8937393
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26.1.10909125
          sudo apt-get clean

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-final

      - name: Create Android Scaffolding
        run: flutter create . --platforms=android

      # 🚀 إجبار البناء على استخدام البصمة الثابتة
      - name: Setup Debug Keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore android/app/debug.keystore

      - name: Increase Gradle Memory
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Fix Android Manifest
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET, os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
              tree = ET.parse(path)
              root = tree.getroot()
              perms = ["CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS", "INTERNET", "ACCESS_NETWORK_STATE", "BLUETOOTH"]
              existing = [p.get("{http://schemas.android.com/apk/res/android}name") for p in root.findall("uses-permission")]
              for p in perms:
                  full_p = "android.permission." + p
                  if full_p not in existing:
                      ET.SubElement(root, "uses-permission", {"{http://schemas.android.com/apk/res/android}name": full_p})
              app = root.find("application")
              if app is not None:
                  app.set("{http://schemas.android.com/apk/res/android}label", "DIRASA 2TM")
                  act = app.find("activity")
                  if act is not None:
                      act.set("{http://schemas.android.com/apk/res/android}exported", "true")
              tree.write(path, encoding="utf-8", xml_declaration=True)
          '

      - name: Fix Gradle Config
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle.kts
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts
          if ! grep -q "storeFile = file(\"debug.keystore\")" android/app/build.gradle.kts; then
            sed -i 's/signingConfigs {/signingConfigs {\n        getByName("debug") {\n            storeFile = file("debug.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }/' android/app/build.gradle.kts
          fi

      - name: Setup Firebase Config
        run: |
          cp google-services.json android/app/google-services.json
          sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/' android/settings.gradle.kts
          sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-debug.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "final-v1.0.${{ github.run_number }}"
          name: "DIRASA 2TM - Final ${{ github.run_number }}"
          body: "النسخة النهائية"
          draft: false
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
