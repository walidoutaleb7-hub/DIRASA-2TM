name: Build Flutter APK (Android 16 Ready)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Cache Gradle & NDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk
          key: ${{ runner.os }}-gradle-ndk-v1

      - name: Create Android Scaffolding
        run: flutter create . --platforms=android

      - name: Force Android 16 Compatibility (SDK 36, MultiDex, Manifest)
        run: |
          # 1. إجبار targetSdk و compileSdk على 36
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          
          # 2. إضافة MultiDex وتعطيل Minify بشكل صحيح
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/g' android/app/build.gradle.kts
          
          # إضافة MultiDex إذا لم تكن موجودة
          if ! grep -q "multiDexEnabled" android/app/build.gradle.kts; then
            sed -i 's/defaultConfig {/defaultConfig {\n            multiDexEnabled = true/' android/app/build.gradle.kts
          fi

          # 3. إصلاح إعدادات Firebase و الأذونات في Manifest
          python3 -c '
          import xml.etree.ElementTree as ET, os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
              tree = ET.parse(path)
              root = tree.getroot()
              app = root.find("application")
              if app is not None:
                  app.set("{http://schemas.android.com/apk/res/android}label", "DIRASA 2TM")
                  act = app.find("activity")
                  if act is not None:
                      act.set("{http://schemas.android.com/apk/res/android}exported", "true")
              perms = ["CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS", "INTERNET", "ACCESS_NETWORK_STATE", "BLUETOOTH"]
              existing = [p.get("{http://schemas.android.com/apk/res/android}name") for p in root.findall("uses-permission")]
              for p in perms:
                  full_p = "android.permission." + p
                  if full_p not in existing:
                      ET.SubElement(root, "uses-permission", {"{http://schemas.android.com/apk/res/android}name": full_p})
              tree.write(path, encoding="utf-8", xml_declaration=True)
          '

      - name: Setup Firebase Config
        run: |
          cp google-services.json android/app/google-services.json
          # إضافة إضافة Firebase إلى settings.gradle.kts
          sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/' android/settings.gradle.kts
          # تطبيق الإضافة في build.gradle.kts
          sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK for arm64 only
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.0.${{ github.run_number }}"
          name: "DIRASA 2TM - Build ${{ github.run_number }}"
          body: "النسخة النهائية المستقرة - دعم أندرويد 16"
          draft: false
          prerelease: false
          allowUpdates: true
          replacesArtifacts: true
