name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create Android Scaffolding
        run: flutter create . --platforms=android

      # ✅ إعداد Firebase بشكل صحيح ليتوافق مع Gradle الجديد
      - name: Setup Firebase Config
        run: |
          cp google-services.json android/app/ || true
          
          # إضافة إصدار إضافة Firebase إلى settings.gradle
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/' android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i 's/plugins {/plugins {\n    id "com.google.gms.google-services" version "4.4.1" apply false/' android/settings.gradle
          fi
          
          # تطبيق إضافة Firebase في ملف التطبيق
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/plugins {/plugins {\n    id "com.google.gms.google-services"/' android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      # 🔑 الحل السحري والمحمي ضد الأخطاء (compileSdk)
      - name: Force compileSdk 36 in all downloaded plugins
        run: |
          set +e 
          
          [ -f android/app/build.gradle.kts ] && sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          [ -f android/app/build.gradle.kts ] && sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' android/app/build.gradle.kts
          [ -f android/app/build.gradle ] && sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
          [ -f android/app/build.gradle ] && sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' android/app/build.gradle
          
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle.kts" -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle.kts" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' {} +

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
