name: Build Flutter APK (Debug Test)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-debug-v3

      - name: Create Android Scaffolding
        run: flutter create . --platforms=android

      - name: Fix Android Manifest and Permissions
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET, os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
              tree = ET.parse(path)
              root = tree.getroot()
              
              perms = ["CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS", "INTERNET", "ACCESS_NETWORK_STATE", "BLUETOOTH"]
              existing = [p.get("{http://schemas.android.com/apk/res/android}name") for p in root.findall("uses-permission")]
              for p in perms:
                  full_p = "android.permission." + p
                  if full_p not in existing:
                      ET.SubElement(root, "uses-permission", {"{http://schemas.android.com/apk/res/android}name": full_p})
              
              app = root.find("application")
              if app is not None:
                  app.set("{http://schemas.android.com/apk/res/android}label", "DIRASA 2TM")
                  act = app.find("activity")
                  if act is not None:
                      act.set("{http://schemas.android.com/apk/res/android}exported", "true")
                      act.set("{http://schemas.android.com/apk/res/android}configChanges", "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode")
              
              tree.write(path, encoding="utf-8", xml_declaration=True)
          '

      - name: Fix Gradle Config (Android 16 & MultiDex)
        run: |
          # إجبار الإصدارات لتتوافق مع Android 16 (API 36)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle.kts
          
          # تفعيل MultiDex (ضروري جداً لمنع الانهيار في الأجهزة الحديثة)
          if ! grep -q "multiDexEnabled" android/app/build.gradle.kts; then
            sed -i 's/defaultConfig {/defaultConfig {\n            multiDexEnabled = true/' android/app/build.gradle.kts
          fi

      - name: Setup Firebase Config
        run: |
          cp google-services.json android/app/google-services.json
          sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/' android/settings.gradle.kts
          sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-debug.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "test-v1.0.${{ github.run_number }}"
          name: "DIRASA 2TM - Test Build ${{ github.run_number }}"
          body: "نسخة اختبارية لمعرفة سبب الإغلاق على أندرويد 16"
          draft: false
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
