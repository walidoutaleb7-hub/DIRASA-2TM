name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache NDK and CMake
        uses: actions/cache@v3
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: ${{ runner.os }}-ndk-cmake
          restore-keys: |
            ${{ runner.os }}-ndk-cmake

      - name: Create Android Scaffolding
        run: flutter create . --platforms=android

      - name: Fix App Name, Permissions, and Exported
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          import os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
              tree = ET.parse(path)
              root = tree.getroot()
              app = root.find("application")
              if app is not None:
                  app.set("{http://schemas.android.com/apk/res/android}label", "DIRASA 2TM")
                  act = app.find("activity")
                  if act is not None:
                      act.set("{http://schemas.android.com/apk/res/android}exported", "true")
              perms = ["CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS", "INTERNET", "ACCESS_NETWORK_STATE", "BLUETOOTH"]
              existing = [p.get("{http://schemas.android.com/apk/res/android}name") for p in root.findall("uses-permission")]
              for p in perms:
                  full_p = "android.permission." + p
                  if full_p not in existing:
                      ET.SubElement(root, "uses-permission", {"{http://schemas.android.com/apk/res/android}name": full_p})
              tree.write(path, encoding="utf-8", xml_declaration=True)
          '

      - name: Fix Gradle Config (Package, MinSdk, Disable Minify)
        run: |
          # نسخ ملف الحماية
          cp proguard-rules.pro android/app/proguard-rules.pro || true
          
          # تعديل ملفات Groovy (build.gradle)
          if [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId ".*"/applicationId "com.example.video_meet_app"/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
            sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
          fi

          # تعديل ملفات Kotlin DSL (build.gradle.kts) - هذا هو سبب المشكلة السابقة
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = ".*"/applicationId = "com.example.video_meet_app"/g' android/app/build.gradle.kts
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle.kts
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' android/app/build.gradle.kts
            sed -i 's/isShrinkResources = true/isShrinkResources = false/g' android/app/build.gradle.kts
            # تأكد من إزالة السطر القديم إذا وجد
            sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle.kts
            sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle.kts
          fi

      - name: Setup Firebase Config
        run: |
          cp google-services.json android/app/google-services.json
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false/' android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            sed -i 's/plugins {/plugins {\n    id "com.google.gms.google-services" version "4.4.1" apply false/' android/settings.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/plugins {/plugins {\n    id "com.google.gms.google-services"/' android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Force compileSdk 36 in all downloaded plugins
        run: |
          set +e 
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = flutterCompileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = 3[0-9]/compileSdk = 36/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutterCompileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion 3[0-9]/compileSdkVersion 36/g' android/app/build.gradle
          fi
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdkVersion flutterCompileSdkVersion/compileSdkVersion 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdkVersion 3[0-9]/compileSdkVersion 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle.kts" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle.kts" -exec sed -i 's/compileSdk = flutterCompileSdkVersion/compileSdk = 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle.kts" -exec sed -i 's/compileSdk = 3[0-9]/compileSdk = 36/g' {} +

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v1.0.${{ github.run_number }}"
          name: "DIRASA 2TM - Build ${{ github.run_number }}"
          body: "تطبيق DIRASA 2TM - نسخة مستقرة ومحسنة"
          draft: false
          prerelease: false
          allowUpdates: true
          replacesArtifacts: true
